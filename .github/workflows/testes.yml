name: Testes SQL
on: [pull_request, workflow_dispatch]
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar PostgreSQL
        run: bash demo.sh subir
      - name: Carregar dados
        run: bash demo.sh base
      - name: Aplicar consulta
        run: bash demo.sh aplicar
      - name: Validar contrato
        run: bash demo.sh testar
      - name: Encerrar
        if: always()
        run: bash demo.sh encerrar
