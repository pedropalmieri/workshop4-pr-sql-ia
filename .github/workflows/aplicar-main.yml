name: Aplicar main no banco de demonstracao
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - sql/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banco-demonstracao-workshop4
  cancel-in-progress: false
jobs:
  aplicar:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, ARM64, ws4-banco-demo]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Aplicar SQL e validar no PostgreSQL existente
        run: bash scripts/aplicar-no-banco.sh
