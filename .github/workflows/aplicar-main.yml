name: Aplicar main no banco de demonstracao
on:
  push:
    branches: [main]
    paths:
      - sql/**
      - scripts/aplicar-no-banco.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banco-demonstracao-workshop4
  cancel-in-progress: false
jobs:
  aplicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, ws4-banco-demo]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Aplicar SQL e validar no PostgreSQL existente
        run: bash scripts/aplicar-no-banco.sh
