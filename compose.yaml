services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop_local
      POSTGRES_DB: workshop
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Banco descartável e sem porta exposta. Os comandos usam docker compose exec.
    tmpfs:
      - /var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:9.19
    profiles: [interface]
    environment:
      PGADMIN_DEFAULT_EMAIL: workshop@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_local
      PGADMIN_DISABLE_POSTFIX: "1"
      PGPASS_FILE: /pgadmin4/workshop.pgpass
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/workshop.pgpass:/pgadmin4/workshop.pgpass:ro
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
  validador:
    profiles: [validacao]
    build:
      context: .
      dockerfile: infra/validacao/Dockerfile
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: workshop
      PGPASSWORD: workshop_local
      PGDATABASE: workshop
    volumes:
      - .:/workspace:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin-data:
